name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release_keystore.jks
          echo "$KEYSTORE_PROPERTIES_BASE64" | base64 --decode > keystore.properties
          # CI writes keystore at repo root; override the local absolute storeFile path
          sed -i 's|^storeFile=.*|storeFile=release_keystore.jks|' keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk \
            release/360vrbrodo-${{ steps.version.outputs.tag }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Update ${{ steps.version.outputs.tag }}

            In-app updater will detect this release automatically.

            **Install:** download APK below, or let the in-app updater handle it.
          files: release/*.apk
          draft: false
          prerelease: false
